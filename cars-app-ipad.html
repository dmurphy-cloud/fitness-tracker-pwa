<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mason's Cars World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .road-area {
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 100%;
            height: 35%;
            pointer-events: none;
        }

        .car {
            position: absolute;
            height: auto;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s ease-out;
            will-change: transform, left;
        }

        .car img {
            height: 100%;
            width: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        .car.tapped {
            transform: scale(1.15) !important;
        }

        .car.bobbing {
            animation: bob 3s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .car.tapped.bobbing {
            animation: bob-tapped 3s ease-in-out infinite;
        }

        @keyframes bob-tapped {
            0%, 100% { transform: scale(1.15) translateY(0); }
            50% { transform: scale(1.15) translateY(-8px); }
        }

        .family-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 14%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5vw;
            padding: 0 5vw;
        }

        .family-photo {
            width: 12vmin;
            height: 12vmin;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .family-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .family-photo:active,
        .family-photo.glowing {
            border-color: #ffd700;
            box-shadow: 0 0 25px 8px rgba(255,215,0,0.6), 0 0 50px 15px rgba(255,215,0,0.3);
            transform: scale(1.1);
        }

        .family-photo .name {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5vmin;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .photo-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .photo-name {
            color: white;
            font-size: 2.2vmin;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sound-toggle:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.3);
        }

        .sound-toggle.muted {
            background: rgba(255,0,0,0.2);
            border-color: rgba(255,100,100,0.5);
        }

        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 4vmin;
            font-weight: 700;
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
    </style>
</head>

        // ============================================
        // AUDIO ENGINE - Calming engine sounds using Web Audio API
        // ============================================

        class AudioEngine {
            constructor() {
                this.context = null;
                this.enabled = true;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio not supported');
                }
            }

            playEngineSound(carType) {
                if (!this.enabled || !this.context) return;

                // Resume context if suspended (iOS requirement)
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }

                const now = this.context.currentTime;

                // Create oscillators for a gentle, calming engine purr
                const osc1 = this.context.createOscillator();
                const osc2 = this.context.createOscillator();
                const gainNode = this.context.createGain();
                const filter = this.context.createBiquadFilter();

                // Different frequencies for different cars
                const frequencies = {
                    mcqueen: { base: 85, mod: 42 },
                    mack: { base: 55, mod: 27 },
                    mater: { base: 70, mod: 35 }
                };

                const freq = frequencies[carType] || frequencies.mcqueen;

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(freq.base, now);

                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(freq.mod, now);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, now);
                filter.Q.setValueAtTime(1, now);

                // Gentle volume envelope
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.1);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.3);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.8);

                // Connect nodes
                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(this.context.destination);

                // Start and stop
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.9);
                osc2.stop(now + 0.9);
            }

            playFamilyChime() {
                if (!this.enabled || !this.context) return;

                if (this.context.state === 'suspended') {
                    this.context.resume();
                }

                const now = this.context.currentTime;

                // Gentle chime sound for family photos
                const osc = this.context.createOscillator();
                const gainNode = this.context.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now); // C5
                osc.frequency.setValueAtTime(659, now + 0.1); // E5
                osc.frequency.setValueAtTime(784, now + 0.2); // G5

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0.08, now + 0.2);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);

                osc.connect(gainNode);
                gainNode.connect(this.context.destination);

                osc.start(now);
                osc.stop(now + 0.7);
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }
        }

        // ============================================
        // CAR ANIMATION SYSTEM
        // ============================================

        class Car {
            constructor(type, imageSrc, roadArea, audio) {
                this.type = type;
                this.roadArea = roadArea;
                this.audio = audio;
                this.element = document.createElement('div');
                this.element.className = 'car bobbing';
                this.element.innerHTML = `<img src="${imageSrc}" alt="${type}">`;

                // Set car sizes
                const sizes = {
                    mcqueen: '18vmin',
                    mack: '30vmin',
                    mater: '16vmin'
                };
                this.element.style.height = sizes[type] || '15vmin';

                // Vertical positioning on road
                const verticalPositions = {
                    mcqueen: '20%',
                    mack: '5%',
                    mater: '35%'
                };
                this.element.style.top = verticalPositions[type] || '25%';

                // Animation duration (15-25 seconds as requested)
                this.duration = 15000 + Math.random() * 10000;

                // Stagger start positions
                const startOffsets = {
                    mcqueen: 0,
                    mack: 0.3,
                    mater: 0.6
                };
                this.startOffset = startOffsets[type] || 0;

                this.roadArea.appendChild(this.element);
                this.setupInteraction();
                this.startAnimation();
            }

            setupInteraction() {
                const handleTap = (e) => {
                    e.preventDefault();
                    this.element.classList.add('tapped');
                    this.audio.playEngineSound(this.type);

                    setTimeout(() => {
                        this.element.classList.remove('tapped');
                    }, 300);
                };

                this.element.addEventListener('touchstart', handleTap, { passive: false });
                this.element.addEventListener('click', handleTap);
            }

            startAnimation() {
                const animate = () => {
                    const screenWidth = window.innerWidth;
                    const carWidth = this.element.offsetWidth || 200;
                    const startX = screenWidth + carWidth;
                    const endX = -carWidth - 50;

                    // Calculate initial position based on offset
                    const totalDistance = startX - endX;
                    const offsetDistance = totalDistance * this.startOffset;

                    let startTime = null;
                    let initialOffset = offsetDistance;

                    const step = (timestamp) => {
                        if (!startTime) startTime = timestamp;
                        const elapsed = timestamp - startTime;
                        const progress = (elapsed / this.duration) + (initialOffset / totalDistance);
                        const adjustedProgress = progress % 1;

                        const currentX = startX - (adjustedProgress * totalDistance);
                        this.element.style.left = `${currentX}px`;

                        // Reset offset after first loop
                        if (progress >= 1) {
                            initialOffset = 0;
                        }

                        requestAnimationFrame(step);
                    };

                    requestAnimationFrame(step);
                };

                animate();
            }
        }

        // ============================================
        // FAMILY PHOTO SYSTEM
        // ============================================

        class FamilyPhoto {
            constructor(name, imageSrc, container, audio) {
                this.name = name;
                this.audio = audio;

                const wrapper = document.createElement('div');
                wrapper.className = 'photo-wrapper';

                this.element = document.createElement('div');
                this.element.className = 'family-photo';
                this.element.innerHTML = `<img src="${imageSrc}" alt="${name}">`;

                const nameLabel = document.createElement('div');
                nameLabel.className = 'photo-name';
                nameLabel.textContent = name;

                wrapper.appendChild(this.element);
                wrapper.appendChild(nameLabel);
                container.appendChild(wrapper);

                this.setupInteraction();
            }

            setupInteraction() {
                const handleTap = (e) => {
                    e.preventDefault();
                    this.element.classList.add('glowing');
                    this.audio.playFamilyChime();

                    setTimeout(() => {
                        this.element.classList.remove('glowing');
                    }, 600);
                };

                this.element.addEventListener('touchstart', handleTap, { passive: false });
                this.element.addEventListener('click', handleTap);
            }
        }

        // ============================================

        class CarsApp {
            constructor() {
                this.audio = new AudioEngine();
                this.cars = [];
                this.familyPhotos = [];

                this.init();
            }

            init() {
                // Set background
                const bg = document.getElementById('background');
                bg.style.setProperty('--bg-image', `url("${IMAGES.background}")`);
                bg.style.backgroundImage = `url("${IMAGES.background}")`;

                // Get containers
                const roadArea = document.getElementById('roadArea');
                const familyBar = document.getElementById('familyBar');

                // Initialize audio on first interaction
                document.addEventListener('touchstart', () => this.audio.init(), { once: true });
                document.addEventListener('click', () => this.audio.init(), { once: true });

                // Create cars (right to left movement)
                this.cars.push(new Car('mcqueen', IMAGES.mcqueen, roadArea, this.audio));
                this.cars.push(new Car('mack', IMAGES.mack, roadArea, this.audio));
                this.cars.push(new Car('mater', IMAGES.mater, roadArea, this.audio));

                // Create family photos
                this.familyPhotos.push(new FamilyPhoto('Mason', IMAGES.mason, familyBar, this.audio));
                this.familyPhotos.push(new FamilyPhoto('Lola', IMAGES.lola, familyBar, this.audio));
                this.familyPhotos.push(new FamilyPhoto('Mam', IMAGES.mam, familyBar, this.audio));
                this.familyPhotos.push(new FamilyPhoto('Dad', IMAGES.dad, familyBar, this.audio));

                // Setup sound toggle
                this.setupSoundToggle();

                // Prevent default touch behaviors
                document.addEventListener('touchmove', (e) => {
                    if (e.target.closest('.car') || e.target.closest('.family-photo')) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }

            setupSoundToggle() {
                const toggle = document.getElementById('soundToggle');

                const handleToggle = (e) => {
                    e.preventDefault();
                    this.audio.init();
                    const enabled = this.audio.toggle();
                    toggle.textContent = enabled ? '🔊' : '🔇';
                    toggle.classList.toggle('muted', !enabled);
                };

                toggle.addEventListener('touchstart', handleToggle, { passive: false });
                toggle.addEventListener('click', handleToggle);
            }
        }

        // Start the app when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new CarsApp());
        } else {
            new CarsApp();
        }
    </script>
</body>
</html>
