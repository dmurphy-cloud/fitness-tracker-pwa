<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mason's Cars World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1e1e3f;
            color: white;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
            padding: 20px;
            font-size: 22px;
        }
        .slots {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }
        .slot {
            width: 45%;
            max-width: 160px;
            background: rgba(255,255,255,0.1);
            border: 2px dashed #666;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
        }
        .slot.done {
            border: 2px solid #4ecdc4;
        }
        .slot b {
            display: block;
            color: #ffd93d;
            font-size: 14px;
        }
        .slot span {
            display: block;
            color: #999;
            font-size: 11px;
            margin: 5px 0;
        }
        .slot img {
            max-width: 80px;
            max-height: 50px;
            border-radius: 5px;
            margin-top: 5px;
        }
        .slot input {
            display: block;
            width: 100%;
            margin-top: 8px;
            font-size: 12px;
        }
        button {
            display: block;
            width: 80%;
            max-width: 250px;
            margin: 20px auto;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff6b6b;
            border: none;
            border-radius: 25px;
        }
        button:disabled {
            background: #555;
        }

        /* APP */
        #app {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1e1e3f;
        }
        #app.show { display: block; }
        #bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
        }
        #track {
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 100%;
            height: 35%;
        }
        .car {
            position: absolute;
            height: 14vmin;
        }
        .car img {
            height: 100%;
            width: auto;
        }
        #mcqueen { height: 15vmin; top: 30%; }
        #mack { height: 24vmin; top: 5%; }
        #mater { height: 13vmin; top: 55%; }

        #family {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 14%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3vw;
        }
        .fam {
            text-align: center;
        }
        .fam img {
            width: 10vmin;
            height: 10vmin;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }
        .fam p {
            font-size: 10px;
            margin-top: 3px;
        }
        .topbtn {
            position: absolute;
            top: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: none;
            font-size: 20px;
        }
        #backBtn { left: 10px; }
        #soundBtn { right: 10px; }
        .fam { position: relative; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body>

<div id="setup">
    <h1>Mason's Cars World</h1>
    <div class="slots">
        <div class="slot" id="s-background">
            <b>Background</b>
            <span>Radiator Springs</span>
            <input type="file" accept="image/*" onchange="addImg(this,'background')">
        </div>
        <div class="slot" id="s-mcqueen">
            <b>McQueen</b>
            <span>Red race car</span>
            <input type="file" accept="image/*" onchange="addImg(this,'mcqueen')">
        </div>
        <div class="slot" id="s-mack">
            <b>Mack</b>
            <span>Big truck</span>
            <input type="file" accept="image/*" onchange="addImg(this,'mack')">
        </div>
        <div class="slot" id="s-mater">
            <b>Mater</b>
            <span>Tow truck</span>
            <input type="file" accept="image/*" onchange="addImg(this,'mater')">
        </div>
        <div class="slot" id="s-mason">
            <b>Mason</b>
            <span>Photo</span>
            <input type="file" accept="image/*" onchange="addImg(this,'mason')">
        </div>
        <div class="slot" id="s-lola">
            <b>Lola</b>
            <span>Photo</span>
            <input type="file" accept="image/*" onchange="addImg(this,'lola')">
        </div>
        <div class="slot" id="s-mam">
            <b>Mam</b>
            <span>Photo</span>
            <input type="file" accept="image/*" onchange="addImg(this,'mam')">
        </div>
        <div class="slot" id="s-dad">
            <b>Dad</b>
            <span>Photo</span>
            <input type="file" accept="image/*" onchange="addImg(this,'dad')">
        </div>
    </div>
    <button type="button" onclick="startApp()">Start Racing!</button>
</div>

<div id="app">
    <div id="bg"></div>
    <div id="track"></div>
    <div id="family"></div>
    <button class="topbtn" id="backBtn" onclick="location.reload()">⚙️</button>
    <button class="topbtn" id="soundBtn" onclick="toggleSound()">🔊</button>
</div>

<script>
var imgs = {};
var soundOn = true;
var audioCtx = null;

function addImg(input, id) {
    var file = input.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
        imgs[id] = e.target.result;

        var slot = document.getElementById('s-' + id);
        slot.classList.add('done');

        var img = slot.querySelector('img');
        if (!img) {
            img = document.createElement('img');
            slot.appendChild(img);
        }
        img.src = e.target.result;

        checkReady();
    };
    reader.readAsDataURL(file);
}

function checkReady() {
    // Button is always ready now
}

function startApp() {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').classList.add('show');

    if (imgs.background) {
        document.getElementById('bg').style.backgroundImage = 'url(' + imgs.background + ')';
    }

    if (imgs.mcqueen) makeCar('mcqueen', imgs.mcqueen);
    if (imgs.mack) makeCar('mack', imgs.mack);
    if (imgs.mater) makeCar('mater', imgs.mater);

    if (imgs.mason) makeFam('Mason', imgs.mason);
    if (imgs.lola) makeFam('Lola', imgs.lola);
    if (imgs.mam) makeFam('Mam', imgs.mam);
    if (imgs.dad) makeFam('Dad', imgs.dad);

    runAnimation();
}

var cars = [];

function makeCar(id, src) {
    var div = document.createElement('div');
    div.className = 'car';
    div.id = id;
    div.innerHTML = '<img src="' + src + '">';
    document.getElementById('track').appendChild(div);

    var car = {
        el: div,
        id: id,
        x: window.innerWidth + Math.random() * 200,
        speed: (id === 'mcqueen' ? 2.5 : id === 'mack' ? 1.2 : 1.8)
    };
    cars.push(car);

    function tapCar() {
        playSound(id);
        car.speed = car.speed * 2;
        div.style.transform = 'scale(1.15)';
        setTimeout(function() {
            car.speed = (id === 'mcqueen' ? 2.5 : id === 'mack' ? 1.2 : 1.8);
            div.style.transform = 'scale(1)';
        }, 800);
    }
    div.ontouchstart = tapCar;
    div.onclick = tapCar;
}

function runAnimation() {
    for (var i = 0; i < cars.length; i++) {
        var car = cars[i];
        car.x = car.x - car.speed;
        if (car.x < -300) {
            car.x = window.innerWidth + 100;
        }
        car.el.style.left = car.x + 'px';
    }
    requestAnimationFrame(runAnimation);
}

function makeFam(name, src) {
    var div = document.createElement('div');
    div.className = 'fam';
    div.innerHTML = '<img src="' + src + '"><p>' + name + '</p>';
    document.getElementById('family').appendChild(div);

    function tapFam() {
        playSound('sparkle');
        // Make image glow
        var img = div.querySelector('img');
        img.style.boxShadow = '0 0 20px gold';
        img.style.borderColor = 'gold';
        setTimeout(function() {
            img.style.boxShadow = '';
            img.style.borderColor = 'white';
        }, 600);
        // Emoji particles
        var emojis = ['❤️','⭐','💖','✨','💕','🌟'];
        for (var i = 0; i < 6; i++) {
            var p = document.createElement('span');
            p.textContent = emojis[i];
            p.style.cssText = 'position:absolute;font-size:20px;pointer-events:none;animation:floatUp 1s forwards;left:' + (Math.random()*60+20) + '%;top:0;';
            div.appendChild(p);
            (function(el) {
                setTimeout(function() { el.remove(); }, 1000);
            })(p);
        }
    }
    div.ontouchstart = tapFam;
    div.onclick = tapFam;
}

function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
}

function playSound(type) {
    initAudio();
    if (!soundOn || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    var now = audioCtx.currentTime;
    var gain = audioCtx.createGain();
    gain.connect(audioCtx.destination);

    if (type === 'mcqueen') {
        var osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.7);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.9);
    } else if (type === 'mater') {
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 380;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.25);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.4);
    } else if (type === 'mack') {
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 130;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.7);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.8);
    } else if (type === 'sparkle') {
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

function toggleSound() {
    initAudio();
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}
</script>

</body>
</html>
