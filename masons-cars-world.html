<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mason's Cars World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
        }

        /* SETUP SCREEN */
        #setup {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
        }
        #setup.hidden { display: none; }
        .title { color: #ff6b6b; font-size: 24px; text-align: center; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            max-width: 700px;
            margin: 0 auto 20px;
        }
        .slot {
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-height: 120px;
        }
        .slot.done { border: 2px solid #4ecdc4; }
        .slot .name { color: #ffd93d; font-weight: bold; font-size: 14px; }
        .slot .hint { color: #888; font-size: 11px; margin: 4px 0; }
        .slot img { max-width: 100%; max-height: 60px; border-radius: 6px; margin-top: 6px; }
        .slot input { display: none; }
        .btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff6b6b;
            border: none;
            border-radius: 25px;
        }
        .btn:disabled { background: #555; }

        /* MAIN APP */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }
        #app.visible { display: block; }
        #bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }
        #track {
            position: absolute;
            bottom: 14%;
            left: 0;
            width: 100%;
            height: 40%;
        }
        .car {
            position: absolute;
            height: 15vmin;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .car img { height: 100%; width: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); }
        .car.tap { transform: scale(1.15); }
        #mcqueen { height: 16vmin; }
        #mack { height: 26vmin; }
        #mater { height: 14vmin; }

        #family {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 13%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4vw;
        }
        .photo-wrap { text-align: center; position: relative; }
        .photo {
            width: 11vmin;
            height: 11vmin;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.5);
            transition: all 0.3s;
        }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        .photo.glow {
            border-color: gold;
            box-shadow: 0 0 20px gold;
            transform: scale(1.1);
        }
        .photo-name { color: white; font-size: 2vmin; margin-top: 4px; }
        .particle {
            position: absolute;
            font-size: 18px;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }
        .ctrl {
            position: absolute;
            top: 15px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            font-size: 22px;
            z-index: 100;
        }
        #soundBtn { right: 15px; }
        #backBtn { left: 15px; }
    </style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
    <div class="title">Mason's Cars World</div>
    <div class="grid" id="grid"></div>
    <button class="btn" id="startBtn" disabled>Start Racing!</button>
</div>

<!-- APP -->
<div id="app">
    <div id="bg"></div>
    <div id="track"></div>
    <div id="family"></div>
    <button class="ctrl" id="backBtn">⚙️</button>
    <button class="ctrl" id="soundBtn">🔊</button>
</div>

<script>
// Simple image storage
const images = {};
const slots = [
    {id:'background', name:'Background', hint:'Radiator Springs'},
    {id:'mcqueen', name:'McQueen', hint:'Red race car'},
    {id:'mack', name:'Mack', hint:'Big truck'},
    {id:'mater', name:'Mater', hint:'Tow truck'},
    {id:'mason', name:'Mason', hint:'Photo'},
    {id:'lola', name:'Lola', hint:'Photo'},
    {id:'mam', name:'Mam', hint:'Photo'},
    {id:'dad', name:'Dad', hint:'Photo'}
];

// Audio
let audioCtx = null;
let soundOn = true;

function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
}

function playSound(type) {
    if (!soundOn || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    gain.connect(audioCtx.destination);

    if (type === 'mcqueen') {
        // Race car vroom
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.7);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.9);
    } else if (type === 'mater') {
        // Tow truck beep beep
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 380;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.25);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.4);
    } else if (type === 'mack') {
        // Big truck horn
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.value = 130;
        osc2.type = 'sine';
        osc2.frequency.value = 165;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.7);
        osc1.connect(gain);
        osc2.connect(gain);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.8);
        osc2.stop(now + 0.8);
    } else if (type === 'sparkle') {
        // Family sparkle
        [600, 800, 1000].forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = f;
            g.gain.setValueAtTime(0.06, now + i*0.08);
            g.gain.linearRampToValueAtTime(0, now + i*0.08 + 0.3);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start(now + i*0.08);
            osc.stop(now + i*0.08 + 0.35);
        });
    }
}

// Setup UI
function buildSetup() {
    const grid = document.getElementById('grid');
    slots.forEach(s => {
        const div = document.createElement('div');
        div.className = 'slot';
        div.id = 'slot-' + s.id;
        div.innerHTML = `<div class="name">${s.name}</div><div class="hint">${s.hint}</div><input type="file" accept="image/*">`;
        grid.appendChild(div);

        const input = div.querySelector('input');
        div.onclick = () => input.click();

        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                images[s.id] = ev.target.result;
                div.classList.add('done');
                let img = div.querySelector('img');
                if (!img) {
                    img = document.createElement('img');
                    div.appendChild(img);
                }
                img.src = ev.target.result;
                checkReady();
            };
            reader.readAsDataURL(file);
        };
    });
}

function checkReady() {
    const count = Object.keys(images).length;
    document.getElementById('startBtn').disabled = count < 4;
}

// Cars animation
let cars = [];
let animating = false;

function createCar(id, src) {
    const el = document.createElement('div');
    el.className = 'car';
    el.id = id;
    el.innerHTML = `<img src="${src}">`;
    document.getElementById('track').appendChild(el);

    const speed = {mcqueen: 1.2, mack: 0.7, mater: 0.95}[id] || 1;
    const lane = {mcqueen: 35, mack: 10, mater: 60}[id] || 35;
    const car = {
        el: el,
        id: id,
        x: window.innerWidth + Math.random() * 200,
        speed: speed,
        lane: lane
    };

    el.style.top = lane + '%';
    cars.push(car);

    el.ontouchstart = el.onclick = (e) => {
        e.preventDefault();
        initAudio();
        el.classList.add('tap');
        playSound(id);
        car.speed = speed * 2;
        setTimeout(() => {
            el.classList.remove('tap');
            car.speed = speed;
        }, 800);
    };
}

function animate() {
    if (!animating) return;

    cars.forEach(car => {
        car.x -= car.speed * 2;
        if (car.x < -300) {
            car.x = window.innerWidth + 100 + Math.random() * 200;
        }
        car.el.style.left = car.x + 'px';
    });

    requestAnimationFrame(animate);
}

// Family photos
function createFamily(name, src) {
    const wrap = document.createElement('div');
    wrap.className = 'photo-wrap';
    wrap.innerHTML = `<div class="photo"><img src="${src}"></div><div class="photo-name">${name}</div>`;
    document.getElementById('family').appendChild(wrap);

    const photo = wrap.querySelector('.photo');
    photo.ontouchstart = photo.onclick = (e) => {
        e.preventDefault();
        initAudio();
        photo.classList.add('glow');
        playSound('sparkle');

        // Hearts and stars
        const emojis = ['❤️','⭐','💖','✨','💕','🌟'];
        for (let i = 0; i < 6; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.textContent = emojis[i];
            p.style.left = (20 + Math.random() * 60) + '%';
            p.style.top = '20%';
            p.style.animationDelay = (i * 0.1) + 's';
            wrap.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }

        setTimeout(() => photo.classList.remove('glow'), 600);
    };
}

// Start app
function startApp() {
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('app').classList.add('visible');

    if (images.background) {
        document.getElementById('bg').style.backgroundImage = `url(${images.background})`;
    }

    if (images.mcqueen) createCar('mcqueen', images.mcqueen);
    if (images.mack) createCar('mack', images.mack);
    if (images.mater) createCar('mater', images.mater);

    if (images.mason) createFamily('Mason', images.mason);
    if (images.lola) createFamily('Lola', images.lola);
    if (images.mam) createFamily('Mam', images.mam);
    if (images.dad) createFamily('Dad', images.dad);

    animating = true;
    animate();
}

// Init
buildSetup();

document.getElementById('startBtn').onclick = startApp;

document.getElementById('backBtn').onclick = () => location.reload();

document.getElementById('soundBtn').onclick = function() {
    initAudio();
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊' : '🔇';
};

// Init audio on any touch
document.addEventListener('touchstart', initAudio, {once: true});
</script>
</body>
</html>
