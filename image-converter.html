<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Base64 Converter for Cars App</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        h1 { color: #ff6b6b; text-align: center; }
        h2 { color: #4ecdc4; margin-top: 30px; }
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .drop-zone {
            border: 3px dashed #4ecdc4;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(78, 205, 196, 0.2);
            border-color: #ff6b6b;
        }
        .drop-zone input { display: none; }
        .preview {
            max-width: 200px;
            max-height: 150px;
            margin: 10px auto;
            display: block;
            border-radius: 8px;
        }
        .output {
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        .copy-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .copy-btn:hover { background: #ff5252; }
        .copy-btn.copied { background: #4ecdc4; }
        .image-slot {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .slot-title {
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 10px;
        }
        .final-output {
            background: #0a0a15;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        #finalCode {
            background: #0d0d1a;
            border: 1px solid #4ecdc4;
            border-radius: 8px;
            padding: 15px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <h1>🏎️ Cars App Image Converter</h1>

    <div class="instructions">
        <strong>Instructions:</strong>
        <ol>
            <li>Drop or select each image below</li>
            <li>Once all images are loaded, click "Generate Final Code"</li>
            <li>Copy the generated code and paste it into <code>cars-app-ipad.html</code></li>
        </ol>
    </div>

    <div id="imageSlots"></div>

    <div class="final-output">
        <h2>Generated Code</h2>
        <button class="copy-btn" onclick="generateFinalCode()">Generate Final Code</button>
        <button class="copy-btn" onclick="copyFinalCode()">Copy All</button>
        <div id="finalCode">Upload all images, then click "Generate Final Code"</div>
    </div>

    <script>
        const slots = [
            { id: 'background', name: 'Background (Radiator Springs)', desc: 'The desert road scene' },
            { id: 'mcqueen', name: 'Lightning McQueen', desc: 'Red race car #95' },
            { id: 'mack', name: 'Mack', desc: 'Big red hauler truck' },
            { id: 'mater', name: 'Mater', desc: 'Rusty tow truck' },
            { id: 'mason', name: 'Mason', desc: 'Family photo' },
            { id: 'lola', name: 'Lola', desc: 'Family photo' },
            { id: 'mam', name: 'Mam', desc: 'Family photo' },
            { id: 'dad', name: 'Dad', desc: 'Family photo' }
        ];

        const imageData = {};

        function createSlots() {
            const container = document.getElementById('imageSlots');
            slots.forEach(slot => {
                const div = document.createElement('div');
                div.className = 'image-slot';
                div.innerHTML = `
                    <div class="slot-title">${slot.name} - ${slot.desc}</div>
                    <div class="drop-zone" id="drop-${slot.id}">
                        <p>Drop image here or click to select</p>
                        <input type="file" accept="image/*" id="input-${slot.id}">
                        <img class="preview" id="preview-${slot.id}" style="display:none">
                    </div>
                    <div class="output" id="output-${slot.id}">No image loaded</div>
                    <button class="copy-btn" onclick="copyToClipboard('${slot.id}')">Copy Base64</button>
                `;
                container.appendChild(div);

                const dropZone = document.getElementById(`drop-${slot.id}`);
                const input = document.getElementById(`input-${slot.id}`);

                dropZone.addEventListener('click', () => input.click());
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('dragover');
                });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                    handleFile(e.dataTransfer.files[0], slot.id);
                });
                input.addEventListener('change', (e) => {
                    handleFile(e.target.files[0], slot.id);
                });
            });
        }

        function handleFile(file, slotId) {
            if (!file || !file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                imageData[slotId] = base64;

                document.getElementById(`preview-${slotId}`).src = base64;
                document.getElementById(`preview-${slotId}`).style.display = 'block';
                document.getElementById(`output-${slotId}`).textContent = base64.substring(0, 100) + '...';
            };
            reader.readAsDataURL(file);
        }

        function copyToClipboard(slotId) {
            if (imageData[slotId]) {
                navigator.clipboard.writeText(imageData[slotId]);
                const btn = event.target;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Base64';
                    btn.classList.remove('copied');
                }, 2000);
            }
        }

        function generateFinalCode() {
            const code = `const IMAGES = {
    background: '${imageData.background || 'PASTE_BACKGROUND_BASE64_HERE'}',
    mcqueen: '${imageData.mcqueen || 'PASTE_MCQUEEN_BASE64_HERE'}',
    mack: '${imageData.mack || 'PASTE_MACK_BASE64_HERE'}',
    mater: '${imageData.mater || 'PASTE_MATER_BASE64_HERE'}',
    mason: '${imageData.mason || 'PASTE_MASON_BASE64_HERE'}',
    lola: '${imageData.lola || 'PASTE_LOLA_BASE64_HERE'}',
    mam: '${imageData.mam || 'PASTE_MAM_BASE64_HERE'}',
    dad: '${imageData.dad || 'PASTE_DAD_BASE64_HERE'}'
};`;
            document.getElementById('finalCode').textContent = code;
        }

        function copyFinalCode() {
            const code = document.getElementById('finalCode').textContent;
            navigator.clipboard.writeText(code);
            const btn = event.target;
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy All';
                btn.classList.remove('copied');
            }, 2000);
        }

        createSlots();
    </script>
</body>
</html>
